<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>David · Pomodoro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css" />
</head>

<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="12" cy="13" r="7" />
            <path d="M12 9v4l2 2" />
            <path d="M9 2h6" />
          </svg>
        </div>
        <div class="brand-text">
          <h1>David</h1>
          <p>Pomodoro · Productividad</p>
        </div>
      </div>
      <div class="mode-switch" role="tablist">
        <button class="mode-btn active" data-mode="focus">Enfoque</button>
        <button class="mode-btn" data-mode="break">Descanso</button>
        <span class="switch-pill"></span>
      </div>
    </header>

    <main class="grid">
      <section class="col-left">
        <div class="card timer-card">
          <div class="timer-ring">
            <svg viewBox="0 0 220 220" class="ring-svg">
              <circle class="ring-bg" cx="110" cy="110" r="100" />
              <circle class="ring-progress" cx="110" cy="110" r="100" />
            </svg>
            <div class="timer-inner">
              <div class="time" id="time">25:00</div>
              <div class="time-label" id="timeLabel">Enfoque</div>
            </div>
          </div>

          <div class="controls">
            <button class="btn btn-primary" id="startBtn">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5v14l11-7z" />
              </svg>
              <span>Iniciar</span>
            </button>
            <button class="btn btn-ghost" id="pauseBtn">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M6 5h4v14H6zM14 5h4v14h-4z" />
              </svg>
              <span>Pausar</span>
            </button>
            <button class="btn btn-secondary" id="resetBtn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 3-6.7" />
                <path d="M3 4v5h5" />
              </svg>
              <span>Reiniciar</span>
            </button>
          </div>
        </div>

        <div class="settings">
          <div class="card setting-card">
            <div class="setting-head">
              <span class="dot blue"></span>
              <span>Enfoque</span>
            </div>
            <div class="stepper">
              <button class="step-btn" data-step="focus" data-dir="-1">−</button>
              <div class="step-value"><strong id="focusVal">25</strong><span>MINUTOS</span></div>
              <button class="step-btn" data-step="focus" data-dir="1">+</button>
            </div>
          </div>
          <div class="card setting-card">
            <div class="setting-head">
              <span class="dot green"></span>
              <span>Descanso</span>
            </div>
            <div class="stepper">
              <button class="step-btn" data-step="break" data-dir="-1">−</button>
              <div class="step-value"><strong id="breakVal">5</strong><span>MINUTOS</span></div>
              <button class="step-btn" data-step="break" data-dir="1">+</button>
            </div>
          </div>
        </div>
      </section>

      <aside class="col-right">
        <div class="card today-card">
          <div class="card-head">
            <h2>Hoy</h2>
            <a href="#" class="link">Resumen del día</a>
          </div>
          <div class="stats">
            <div class="stat">
              <div class="stat-icon blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="9" />
                  <path d="M12 7v5l3 2" />
                </svg></div>
              <div>
                <div class="stat-val" id="statPomodoros">0</div>
                <div class="stat-label">Pomodoros</div>
              </div>
            </div>
            <div class="stat">
              <div class="stat-icon pink"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M3 12h4l3-8 4 16 3-8h4" />
                </svg></div>
              <div>
                <div class="stat-val" id="statMinutes">0m</div>
                <div class="stat-label">Tiempo enfocado</div>
              </div>
            </div>
            <div class="stat">
              <div class="stat-icon green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 19h16" />
                  <path d="M6 19V9" />
                  <path d="M11 19V5" />
                  <path d="M16 19v-7" />
                </svg></div>
              <div>
                <div class="stat-val" id="statFocus">0%</div>
                <div class="stat-label">Concentración</div>
              </div>
            </div>
            <div class="stat">
              <div class="stat-icon amber"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M5 12a7 7 0 0 1 14 0" />
                  <path d="M3 12h18" />
                  <path d="M7 16h10" />
                </svg></div>
              <div>
                <div class="stat-val" id="statBreaks">0</div>
                <div class="stat-label">Descansos</div>
              </div>
            </div>
          </div>
        </div>

        <div class="card week-card">
          <div class="card-head">
            <div>
              <h2>Historial semanal</h2>
              <p class="muted">Pomodoros por día</p>
            </div>
          </div>
          <div class="chart" id="chart"></div>
        </div>
      </aside>
    </main>
  </div>
  <script src="../js/script.js"></script>
</body>

</html>
